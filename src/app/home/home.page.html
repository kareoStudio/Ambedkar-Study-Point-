<ion-content [fullscreen]="true">
  
  <!-- ONLINE -->
  <iframe 
    *ngIf="isOnline"
    [src]="safeUrl" 
    style="width:100%;height:100%;border:none;"
    allow="camera; microphone; geolocation; fullscreen">
  </iframe>

  <!-- OFFLINE -->
  <div *ngIf="!isOnline" style="width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:#1a1a2e;color:white;text-align:center;">
    <div>
      <div style="font-size:80px;margin-bottom:20px;">📡</div>
      <h1 style="color:#e94560;margin:0;">Offline</h1>
      <p style="color:#a0a0a0;">Internet connection nahi hai</p>
      <button (click)="retry()" style="margin-top:30px;padding:15px 40px;font-size:18px;font-weight:bold;color:white;background:#e94560;border:none;border-radius:50px;">
        🔄 Retry
      </button>
    </div>
  </div>

</ion-content>
