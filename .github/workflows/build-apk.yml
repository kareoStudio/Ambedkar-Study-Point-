name: 🚀 Build अम्बेडकर Study Point Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build Web App
        run: npm run build -- --configuration production

      - name: 🤖 Add Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      # ============================================
      # 🔥 ICON FIX: Sync ke BAAD override karo
      # ============================================
      - name: 🎨 Fix App Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          ICON_SRC="src/assets/icon/icon.png"
          
          if [ -f "$ICON_SRC" ]; then
            echo "✅ Icon found! Overriding Capacitor defaults..."
            
            # Create all mipmap directories
            mkdir -p android/app/src/main/res/mipmap-ldpi
            mkdir -p android/app/src/main/res/mipmap-mdpi
            mkdir -p android/app/src/main/res/mipmap-hdpi
            mkdir -p android/app/src/main/res/mipmap-xhdpi
            mkdir -p android/app/src/main/res/mipmap-xxhdpi
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            
            # 🔥 DELETE adaptive icon XML (Samsung force karta hai)
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            
            # Generate LEGACY icons only
            convert "$ICON_SRC" -resize 36x36 android/app/src/main/res/mipmap-ldpi/ic_launcher.png
            convert "$ICON_SRC" -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            
            # Round icons (same image, no mask)
            cp android/app/src/main/res/mipmap-ldpi/ic_launcher.png android/app/src/main/res/mipmap-ldpi/ic_launcher_round.png
            cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            
            # Also copy to drawable (backup)
            mkdir -p android/app/src/main/res/drawable
            cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/drawable/ic_launcher.png
            
            echo "✅ Icons overridden!"
          else
            echo "⚠️ No icon.png found"
          fi

      # ============================================
      # 🔥 SPLASH SCREEN FIX
      # ============================================
      - name: 🎨 Fix Splash Screen
        run: |
          ICON_SRC="src/assets/icon/icon.png"
          
          if [ -f "$ICON_SRC" ]; then
            mkdir -p android/app/src/main/res/drawable
            
            # White background + centered icon
            convert -size 1080x1920 xc:'#ffffff' /tmp/bg.png
            convert "$ICON_SRC" -resize 350x350 /tmp/ic.png
            convert /tmp/bg.png /tmp/ic.png -gravity center -composite android/app/src/main/res/drawable/splash.png
            
            echo "✅ Splash screen created!"
          fi

      # ============================================
      # 🔥 THEME FIX
      # ============================================
      - name: 🎨 Fix Theme
        run: |
          mkdir -p android/app/src/main/res/values
          
          echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/values/styles.xml
          echo '<resources>' >> android/app/src/main/res/values/styles.xml
          echo '    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">' >> android/app/src/main/res/values/styles.xml
          echo '        <item name="windowActionBar">false</item>' >> android/app/src/main/res/values/styles.xml
          echo '        <item name="windowNoTitle">true</item>' >> android/app/src/main/res/values/styles.xml
          echo '    </style>' >> android/app/src/main/res/values/styles.xml
          echo '    <style name="AppTheme.NoActionBar" parent="AppTheme">' >> android/app/src/main/res/values/styles.xml
          echo '    </style>' >> android/app/src/main/res/values/styles.xml
          echo '    <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">' >> android/app/src/main/res/values/styles.xml
          echo '        <item name="android:windowBackground">@drawable/splash</item>' >> android/app/src/main/res/values/styles.xml
          echo '    </style>' >> android/app/src/main/res/values/styles.xml
          echo '</resources>' >> android/app/src/main/res/values/styles.xml

      # ============================================
      # 🔥 ANDROID MANIFEST FIX (Ensure correct icon)
      # ============================================
      - name: 📝 Fix AndroidManifest
        run: |
          # Replace icon reference in AndroidManifest.xml
          sed -i 's/android:icon=".*"/android:icon="@mipmap\/ic_launcher"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:roundIcon=".*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' android/app/src/main/AndroidManifest.xml
          echo "✅ AndroidManifest fixed!"

      - name: 🔨 Build Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: अम्बेडकर-Study-Point-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
