name: 🚀 Build अम्बेडकर Study Point Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      # ============================================
      # STEP 1: Code Checkout
      # ============================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ============================================
      # STEP 2: Setup Node.js
      # ============================================
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================
      # STEP 3: Setup Java
      # ============================================
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ============================================
      # STEP 4: Install Dependencies
      # ============================================
      - name: 📦 Install dependencies
        run: npm install

      # ============================================
      # STEP 5: Build Angular App
      # ============================================
      - name: 🏗️ Build Web App
        run: npm run build -- --configuration production

      # ============================================
      # STEP 6: Add Capacitor Android
      # ============================================
      - name: 🤖 Add Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      # ============================================
      # STEP 7: Generate Icons & Splash Screen
      # ============================================
      - name: 🎨 Generate Icons & Splash Screen
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          ICON_SRC="src/assets/icon/icon.png"
          
          if [ -f "$ICON_SRC" ]; then
            echo "✅ Icon found! Generating adaptive icons..."
            
            # ====== CREATE DIRECTORIES ======
            mkdir -p android/app/src/main/res/mipmap-ldpi
            mkdir -p android/app/src/main/res/mipmap-mdpi
            mkdir -p android/app/src/main/res/mipmap-hdpi
            mkdir -p android/app/src/main/res/mipmap-xhdpi
            mkdir -p android/app/src/main/res/mipmap-xxhdpi
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            mkdir -p android/app/src/main/res/mipmap-anydpi-v26
            mkdir -p android/app/src/main/res/drawable-ldpi
            mkdir -p android/app/src/main/res/drawable-mdpi
            mkdir -p android/app/src/main/res/drawable-hdpi
            mkdir -p android/app/src/main/res/drawable-xhdpi
            mkdir -p android/app/src/main/res/drawable-xxhdpi
            mkdir -p android/app/src/main/res/drawable-xxxhdpi
            
            # ====== FOREGROUND ICONS ======
            convert "$ICON_SRC" -resize 36x36 android/app/src/main/res/mipmap-ldpi/ic_launcher_foreground.png
            convert "$ICON_SRC" -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
            convert "$ICON_SRC" -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
            convert "$ICON_SRC" -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
            convert "$ICON_SRC" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
            convert "$ICON_SRC" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
            
            # ====== BACKGROUND (White) ======
            convert -size 36x36 xc:'#ffffff' android/app/src/main/res/mipmap-ldpi/ic_launcher_background.png
            convert -size 48x48 xc:'#ffffff' android/app/src/main/res/mipmap-mdpi/ic_launcher_background.png
            convert -size 72x72 xc:'#ffffff' android/app/src/main/res/mipmap-hdpi/ic_launcher_background.png
            convert -size 96x96 xc:'#ffffff' android/app/src/main/res/mipmap-xhdpi/ic_launcher_background.png
            convert -size 144x144 xc:'#ffffff' android/app/src/main/res/mipmap-xxhdpi/ic_launcher_background.png
            convert -size 192x192 xc:'#ffffff' android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png
            
            # ====== LEGACY ICONS ======
            convert "$ICON_SRC" -resize 36x36 android/app/src/main/res/mipmap-ldpi/ic_launcher.png
            convert "$ICON_SRC" -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            
            convert "$ICON_SRC" -resize 36x36 android/app/src/main/res/mipmap-ldpi/ic_launcher_round.png
            convert "$ICON_SRC" -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            convert "$ICON_SRC" -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            convert "$ICON_SRC" -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            convert "$ICON_SRC" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            convert "$ICON_SRC" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            
            # ====== ADAPTIVE ICON XML (Using echo - no heredoc) ======
            echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            echo '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' >> android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            echo '    <background android:drawable="@mipmap/ic_launcher_background"/>' >> android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            echo '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' >> android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            echo '</adaptive-icon>' >> android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            
            echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
            echo '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' >> android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
            echo '    <background android:drawable="@mipmap/ic_launcher_background"/>' >> android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
            echo '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' >> android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
            echo '</adaptive-icon>' >> android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
            
            # ====== SPLASH SCREEN WITH ICON ======
            convert -size 320x480 xc:'#ffffff' /tmp/bg_ldpi.png
            convert "$ICON_SRC" -resize 96x96 /tmp/ic_ldpi.png
            convert /tmp/bg_ldpi.png /tmp/ic_ldpi.png -gravity center -composite android/app/src/main/res/drawable-ldpi/splash_screen.png
            
            convert -size 480x800 xc:'#ffffff' /tmp/bg_mdpi.png
            convert "$ICON_SRC" -resize 128x128 /tmp/ic_mdpi.png
            convert /tmp/bg_mdpi.png /tmp/ic_mdpi.png -gravity center -composite android/app/src/main/res/drawable-mdpi/splash_screen.png
            
            convert -size 720x1280 xc:'#ffffff' /tmp/bg_hdpi.png
            convert "$ICON_SRC" -resize 192x192 /tmp/ic_hdpi.png
            convert /tmp/bg_hdpi.png /tmp/ic_hdpi.png -gravity center -composite android/app/src/main/res/drawable-hdpi/splash_screen.png
            
            convert -size 960x1600 xc:'#ffffff' /tmp/bg_xhdpi.png
            convert "$ICON_SRC" -resize 256x256 /tmp/ic_xhdpi.png
            convert /tmp/bg_xhdpi.png /tmp/ic_xhdpi.png -gravity center -composite android/app/src/main/res/drawable-xhdpi/splash_screen.png
            
            convert -size 1440x2560 xc:'#ffffff' /tmp/bg_xxhdpi.png
            convert "$ICON_SRC" -resize 384x384 /tmp/ic_xxhdpi.png
            convert /tmp/bg_xxhdpi.png /tmp/ic_xxhdpi.png -gravity center -composite android/app/src/main/res/drawable-xxhdpi/splash_screen.png
            
            convert -size 1920x3200 xc:'#ffffff' /tmp/bg_xxxhdpi.png
            convert "$ICON_SRC" -resize 512x512 /tmp/ic_xxxhdpi.png
            convert /tmp/bg_xxxhdpi.png /tmp/ic_xxxhdpi.png -gravity center -composite android/app/src/main/res/drawable-xxxhdpi/splash_screen.png
            
            echo "✅ All icons & splash screen generated!"
          else
            echo "⚠️ No icon.png found in src/assets/icon/"
          fi

      # ============================================
      # STEP 8: Fix Theme (Using echo - no heredoc)
      # ============================================
      - name: 🎨 Fix Theme
        run: |
          mkdir -p android/app/src/main/res/values
          
          echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/values/styles.xml
          echo '<resources>' >> android/app/src/main/res/values/styles.xml
          echo '    <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">' >> android/app/src/main/res/values/styles.xml
          echo '        <item name="windowActionBar">false</item>' >> android/app/src/main/res/values/styles.xml
          echo '        <item name="windowNoTitle">true</item>' >> android/app/src/main/res/values/styles.xml
          echo '    </style>' >> android/app/src/main/res/values/styles.xml
          echo '    <style name="AppTheme.NoActionBar" parent="AppTheme">' >> android/app/src/main/res/values/styles.xml
          echo '    </style>' >> android/app/src/main/res/values/styles.xml
          echo '    <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">' >> android/app/src/main/res/values/styles.xml
          echo '        <item name="android:windowBackground">@drawable/splash_screen</item>' >> android/app/src/main/res/values/styles.xml
          echo '    </style>' >> android/app/src/main/res/values/styles.xml
          echo '</resources>' >> android/app/src/main/res/values/styles.xml
          
          echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/values/colors.xml
          echo '<resources>' >> android/app/src/main/res/values/colors.xml
          echo '    <color name="colorPrimary">#ffffff</color>' >> android/app/src/main/res/values/colors.xml
          echo '    <color name="colorPrimaryDark">#ffffff</color>' >> android/app/src/main/res/values/colors.xml
          echo '    <color name="colorAccent">#ffffff</color>' >> android/app/src/main/res/values/colors.xml
          echo '</resources>' >> android/app/src/main/res/values/colors.xml

      # ============================================
      # STEP 9: Build Debug APK
      # ============================================
      - name: 🔨 Build Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # ============================================
      # STEP 10: Upload Debug APK
      # ============================================
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: अम्बेडकर-Study-Point-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
